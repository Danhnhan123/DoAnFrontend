<div class="auth-page">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h2 class="auth-title">Đổi mật khẩu lần đầu</h2>
      <p class="auth-sub">Vì lý do bảo mật, bạn cần đặt mật khẩu mới trước khi sử dụng hệ thống.</p>
    </div>

    <form (ngSubmit)="submit()">
      @if (errorMsg()) {
      <div class="auth-error"><span>{{ errorMsg() }}</span></div>
      }

      <div class="auth-field">
        <label for="cp-old">Mật khẩu hiện tại (được gửi qua email)</label>
        <div class="auth-input-wrap">
          <input [type]="showOld() ? 'text' : 'password'" id="cp-old" placeholder="••••••••" name="oldPassword"
            [ngModel]="oldPassword()" (ngModelChange)="oldPassword.set($event)" [disabled]="loading()"
            autocomplete="current-password" />
          <button type="button" class="toggle" (click)="showOld.set(!showOld())">
            {{ showOld() ? 'Ẩn' : 'Hiện' }}
          </button>
        </div>
      </div>

      <div class="auth-field">
        <label for="cp-new">Mật khẩu mới</label>
        <div class="auth-input-wrap">
          <input [type]="showNew() ? 'text' : 'password'" id="cp-new" placeholder="Tối thiểu 10 ký tự" name="newPassword"
            [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" [disabled]="loading()"
            autocomplete="new-password" />
          <button type="button" class="toggle" (click)="showNew.set(!showNew())">
            {{ showNew() ? 'Ẩn' : 'Hiện' }}
          </button>
        </div>
        <p class="auth-hint">Gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</p>
      </div>

      <div class="auth-field">
        <label for="cp-confirm">Xác nhận mật khẩu mới</label>
        <input type="password" id="cp-confirm" placeholder="Nhập lại mật khẩu mới" name="confirmPassword"
          [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" [disabled]="loading()"
          autocomplete="new-password" />
      </div>

      <button class="auth-btn" type="submit" [disabled]="loading()">
        @if (loading()) { <span class="spin"></span> <span>Đang lưu...</span> }
        @else { <span>Đổi mật khẩu & tiếp tục</span> }
      </button>

      <a class="auth-link" href="javascript:void(0)" (click)="logout()">Đăng xuất</a>
    </form>
  </div>
</div>
