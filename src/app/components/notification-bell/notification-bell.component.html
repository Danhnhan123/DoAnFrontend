<div class="noti-bell" (click)="$event.stopPropagation()">
  <button class="icon-btn" title="Thông báo" (click)="toggle($event)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    @if (unreadCount() > 0) {
    <span class="badge">{{ badgeLabel() }}</span>
    }
  </button>

  @if (open()) {
  <div class="noti-dropdown">
    <div class="noti-head">
      <span class="noti-title-head">Thông báo</span>
      <button type="button" class="noti-viewall" (click)="viewAll()">Xem tất cả</button>
    </div>

    <div class="noti-list">
      @if (loading()) {
      <div class="noti-empty"><span class="spin-sm"></span> Đang tải...</div>
      } @else if (notifications().length === 0) {
      <div class="noti-empty">Không có thông báo</div>
      } @else {
      @for (n of notifications(); track n.id) {
      <div class="noti-item" [class.unread]="!n.isRead" (click)="onClick(n)">
        <span class="noti-dot" [class.on]="!n.isRead"></span>
        <div class="noti-content-wrap">
          <div class="noti-item-title">{{ n.title }}</div>
          <div class="noti-item-content">{{ n.content }}</div>
          <div class="noti-item-time">{{ n.createdDate | date:'dd/MM/yyyy HH:mm' }}</div>
        </div>
        <button type="button" class="noti-mark" (click)="toggleRead(n, $event)"
          [title]="n.isRead ? 'Đánh dấu chưa đọc' : 'Đánh dấu đã đọc'">
          {{ n.isRead ? '○' : '●' }}
        </button>
      </div>
      }
      }
    </div>
  </div>
  }
</div>
