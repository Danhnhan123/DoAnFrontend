<div class="auth-page">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
        </svg>
      </div>
      <h2 class="auth-title">Quên mật khẩu</h2>
      <p class="auth-sub">Nhập email của tài khoản, hệ thống sẽ gửi mật khẩu mới cho bạn.</p>
    </div>

    @if (done()) {
    <div class="auth-success">
      <p>✅ Mật khẩu mới đã được gửi tới email của bạn.</p>
      <p class="muted">Vui lòng kiểm tra hộp thư và đăng nhập, sau đó đổi mật khẩu ngay lần đầu.</p>
    </div>
    <button class="auth-btn" type="button" (click)="goLogin()">Về trang đăng nhập</button>
    } @else {
    <form (ngSubmit)="submit()">
      @if (errorMsg()) {
      <div class="auth-error"><span>{{ errorMsg() }}</span></div>
      }

      <div class="auth-field">
        <label for="fp-email">Email</label>
        <input id="fp-email" type="email" placeholder="user@email.com" name="email"
          [ngModel]="email()" (ngModelChange)="email.set($event)" [disabled]="loading()" autocomplete="email" />
      </div>

      <button class="auth-btn" type="submit" [disabled]="loading()">
        @if (loading()) { <span class="spin"></span> <span>Đang gửi...</span> }
        @else { <span>Gửi mật khẩu mới</span> }
      </button>

      <a class="auth-link" href="javascript:void(0)" (click)="goLogin()">← Về trang đăng nhập</a>
    </form>
    }
  </div>
</div>
