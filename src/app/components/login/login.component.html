<div class="login-shell">
  <section class="login-card" aria-label="Đăng nhập WMS-EC">
    <div class="login-brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18" />
          <path d="M5 21V7l7-4 7 4v14" />
          <path d="M9 21v-8h6v8" />
          <path d="M8 9h8" />
          <path d="M8 12h8" />
        </svg>
      </div>
      <h1 class="brand-name">WMS-EC</h1>
      <p class="brand-sub">Warehouse Management System</p>
    </div>

    <form class="login-form" (ngSubmit)="submit()">
      @if (errorMsg()) {
      <div class="error-banner">
        <span>{{ errorMsg() }}</span>
      </div>
      }

      <div class="field">
        <label class="field-label" for="login-email">Email</label>
        <div class="field-wrap">
          <span class="field-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
          </span>
          <input
            id="login-email"
            class="field-input"
            type="email"
            placeholder="admin@wms-ec.com"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
            name="username"
            autocomplete="username"
            [disabled]="loading()"
          />
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="login-password">Mật khẩu</label>
        <div class="field-wrap">
          <span class="field-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="10" rx="2" />
              <path d="M8 11V8a4 4 0 0 1 8 0v3" />
            </svg>
          </span>
          <input
            id="login-password"
            class="field-input"
            type="password"
            placeholder="••••••••"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            autocomplete="current-password"
            [disabled]="loading()"
          />
        </div>
      </div>

      <a class="forgot-link" href="javascript:void(0)">Quên mật khẩu?</a>

      <button type="submit" class="login-btn" [disabled]="loading()">
        @if (loading()) {
        <span class="spinner"></span>
        <span>Đang đăng nhập...</span>
        } @else {
        <span>Đăng nhập</span>
        }
      </button>
    </form>
  </section>
</div>
