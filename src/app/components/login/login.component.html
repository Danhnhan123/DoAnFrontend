<div class="login-shell" [class.dark]="isDark()">

    <!-- Theme toggle top right -->
    <button class="theme-btn" (click)="themeService.toggle()" title="Đổi giao diện">
      {{ isDark() ? '☀️' : '🌙' }}
    </button>
  
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">⚡</div>
        <h1 class="brand-name">AdminPanel</h1>
        <p class="brand-sub">Hệ thống quản trị</p>
      </div>
  
      <form class="login-form" (ngSubmit)="submit()">
        @if (errorMsg()) {
          <div class="error-banner">
            <span>⚠️</span> {{ errorMsg() }}
          </div>
        }
  
        <div class="field">
          <label class="field-label">Tên đăng nhập</label>
          <div class="field-wrap">
            <span class="field-icon">👤</span>
            <input class="field-input"
              type="text"
              placeholder="Nhập tên đăng nhập"
              [ngModel]="username()"
              (ngModelChange)="username.set($event)"
              name="username"
              autocomplete="username"
              [disabled]="loading()" />
          </div>
        </div>
  
        <div class="field">
          <label class="field-label">Mật khẩu</label>
          <div class="field-wrap">
            <span class="field-icon">🔒</span>
            <input class="field-input"
              [type]="showPass() ? 'text' : 'password'"
              placeholder="Nhập mật khẩu"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
              autocomplete="current-password"
              [disabled]="loading()" />
            <button type="button" class="show-pass" (click)="togglePass()">
              {{ showPass() ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>
  
        <button type="submit" class="login-btn" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner"></span>
            Đang đăng nhập...
          } @else {
            <span>Đăng nhập</span> →
          }
        </button>
      </form>
  
      <p class="login-footer">
        © 2025 AdminPanel — Hệ thống quản trị nội bộ
      </p>
    </div>
  
    <div class="login-bg">
      <div class="bg-orb orb1"></div>
      <div class="bg-orb orb2"></div>
      <div class="bg-orb orb3"></div>
    </div>
  </div>
